# rustc 1.99 crashed (SIGSEGV in LLVM's inliner) on matrix-sdk-sqlite with codegen-units = 1 and the default stack;
# a bigger stack for the compiler's threads fixes it (CMakeLists.txt sets the same for cmake builds: keep the two equal, because a variable that is already in
# the environment, as cmake sets it, wins over this table).
[env]
RUST_MIN_STACK = "134217728"
