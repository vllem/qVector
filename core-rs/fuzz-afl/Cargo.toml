# Fuzz targets for afl.rs (https://github.com/rust-fuzz/afl.rs). Not part of the main workspace: it builds with its own instrumented target dir.
[package]
name = "vector-fuzz-afl"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
afl = "0.18"
vector-core = { path = "..", features = [] }

[profile.release]
opt-level = 1
debug = "line-tables-only"
