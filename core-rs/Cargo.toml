[package]
name = "vector-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Matrix core of the Vector desktop client, on matrix-sdk (E2EE by vodozemac / matrix-sdk-crypto)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
matrix-sdk = { version = "=0.19.1", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs", "markdown", "unstable-msc4274"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time"] }
serde_json = "1"
matrix-sdk-store-encryption = "=0.19.1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
mime = "0.3"
serde = { version = "1", features = ["derive"] }
matrix-sdk-ui = { version = "=0.19.1", default-features = false, features = ["unstable-msc4274"] }
futures-util = "0.3"
wiremock = { version = "0.6", optional = true }

# Quicker to compile than release (no LTO, many codegen units, incremental) and fast enough to run: used by the dev/test builds.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[profile.release]
opt-level = 2
lto = "thin"

[features]
# a tiny fake homeserver (wiremock) for tests and for running the UI without a real account
testkit = ["dep:wiremock"]

[dev-dependencies]
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
wiremock = "0.6"
tempfile = "3"
