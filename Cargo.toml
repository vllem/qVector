# The Rust core (matrix-sdk): one workspace so the lock file and the target directory stay at the repository root.
[workspace]
resolver = "2"
members = ["core-rs"]

[profile.dev]
debug = "line-tables-only"   # full debug info made the build directory tens of gigabytes

# The key derivation of the sealed local files (PBKDF2, 200 000 rounds) takes seconds when unoptimised.
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3

# A smaller program keeps fewer code pages in memory (profiles only count in the workspace root).
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
