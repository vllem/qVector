# The Rust core (matrix-sdk): one workspace so the lock file and the target directory stay at the repository root.
[workspace]
resolver = "2"
members = ["core-rs"]

[profile.dev]
debug = "line-tables-only"   # full debug info made the build directory tens of gigabytes

# A smaller program keeps fewer code pages in memory (profiles only count in the workspace root).
[profile.release]
opt-level = "s"
lto = "thin"
strip = true
